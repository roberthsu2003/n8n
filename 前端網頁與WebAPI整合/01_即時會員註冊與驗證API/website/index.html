<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>極客雲端 - 會員註冊與登入 (n8n WebAPI 後端)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --bg: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --border: rgba(255, 255, 255, 0.1);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --success: #10b981;
      --error: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Outfit', 'Noto Sans TC', sans-serif;
    }

    body {
      background: radial-gradient(circle at top right, #1e1b4b, #0f172a 70%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 440px;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 36px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    .header {
      text-align: center;
      margin-bottom: 28px;
    }

    .logo-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.3);
      padding: 6px 14px;
      border-radius: 100px;
      font-size: 13px;
      color: #a5b4fc;
      margin-bottom: 12px;
    }

    .header h1 {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .header p {
      color: var(--text-muted);
      font-size: 14px;
      margin-top: 6px;
    }

    .tabs {
      display: flex;
      background: rgba(15, 23, 42, 0.6);
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 24px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      text-align: center;
      border: none;
      background: none;
      color: var(--text-muted);
      font-size: 14px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: var(--primary);
      color: #fff;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 6px;
      color: #cbd5e1;
    }

    input {
      width: 100%;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 16px;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
    }

    .btn-submit {
      width: 100%;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-submit:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
    }

    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .response-card {
      margin-top: 20px;
      padding: 14px 18px;
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.5;
      display: none;
      animation: fadeIn 0.3s ease;
    }

    .response-card.success {
      display: block;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: #6ee7b7;
    }

    .response-card.error {
      display: block;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .endpoint-hint {
      margin-top: 18px;
      text-align: center;
      font-size: 11px;
      color: #64748b;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <div class="logo-badge">⚡ n8n WebAPI 後端驅動</div>
      <h1>極客數位會員中心</h1>
      <p>無伺服器後端架構即時驗證體驗</p>
    </div>

    <!-- Webhook URL 設定 -->
    <div class="form-group">
      <label for="webhookUrl">n8n Webhook URL (POST)</label>
      <input type="text" id="webhookUrl" value="http://localhost:5678/webhook/auth-api" placeholder="請填入您的 n8n Webhook 網址">
    </div>

    <div class="tabs">
      <button class="tab-btn active" id="tabRegister" onclick="switchTab('register')">註冊新帳號</button>
      <button class="tab-btn" id="tabLogin" onclick="switchTab('login')">登入系統</button>
    </div>

    <form id="authForm" onsubmit="handleAuthSubmit(event)">
      <div class="form-group" id="nameGroup">
        <label for="userName">用戶姓名</label>
        <input type="text" id="userName" placeholder="請輸入姓名 (例如: 陳大明)" value="陳大明">
      </div>

      <div class="form-group">
        <label for="userEmail">電子信箱</label>
        <input type="email" id="userEmail" placeholder="name@example.com" value="user@example.com" required>
      </div>

      <div class="form-group">
        <label for="userPassword">登入密碼</label>
        <input type="password" id="userPassword" placeholder="••••••••" value="password123" required>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">
        <span id="btnText">立即註冊</span>
      </button>
    </form>

    <div id="responseBox" class="response-card"></div>

    <div class="endpoint-hint">
      前端使用原生 <code>fetch()</code> 發送 POST JSON 請求至 n8n 後端
    </div>
  </div>

  <script>
    let currentAction = 'register';

    function switchTab(action) {
      currentAction = action;
      document.getElementById('tabRegister').classList.toggle('active', action === 'register');
      document.getElementById('tabLogin').classList.toggle('active', action === 'login');
      document.getElementById('nameGroup').style.display = action === 'register' ? 'block' : 'none';
      document.getElementById('btnText').innerText = action === 'register' ? '立即註冊' : '登入系統';
      document.getElementById('responseBox').style.display = 'none';
    }

    async function handleAuthSubmit(e) {
      e.preventDefault();
      const webhookUrl = document.getElementById('webhookUrl').value.trim();
      const email = document.getElementById('userEmail').value.trim();
      const password = document.getElementById('userPassword').value.trim();
      const name = document.getElementById('userName').value.trim();
      const submitBtn = document.getElementById('submitBtn');
      const responseBox = document.getElementById('responseBox');

      if (!webhookUrl) {
        alert('請先輸入 n8n Webhook URL！');
        return;
      }

      submitBtn.disabled = true;
      document.getElementById('btnText').innerText = '處理中...';
      responseBox.className = 'response-card';
      responseBox.style.display = 'none';

      try {
        const payload = {
          action: currentAction,
          email: email,
          password: password,
          name: currentAction === 'register' ? name : undefined
        };

        const res = await fetch(webhookUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await res.json();

        if (res.ok && data.success) {
          responseBox.className = 'response-card success';
          responseBox.innerHTML = `
            <strong>🎉 ${data.message}</strong><br>
            👤 <strong>用戶</strong>: ${data.user?.name || email}<br>
            🔑 <strong>Session Token</strong>: <code>${data.token || 'N/A'}</code>
          `;
        } else {
          responseBox.className = 'response-card error';
          responseBox.innerHTML = `<strong>❌ ${data.message || '操作失敗，請檢查輸入資訊'}</strong>`;
        }
      } catch (err) {
        responseBox.className = 'response-card error';
        responseBox.innerHTML = `<strong>⚠️ 連線錯誤</strong>: ${err.message}<br><small>請確認 n8n Webhook 處於 Active/Listen 狀態且 CORS 允許存取。</small>`;
      } finally {
        submitBtn.disabled = false;
        document.getElementById('btnText').innerText = currentAction === 'register' ? '立即註冊' : '登入系統';
      }
    }
  </script>
</body>
</html>
